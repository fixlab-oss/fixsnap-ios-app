name: FixSnap
options:
  bundleIdPrefix: com.superapp
  developmentLanguage: en

settings:
  base:
    PRODUCT_NAME: FixSnap
    SWIFT_VERSION: 6.0
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 1
    SUPPORTED_PLATFORMS: iphoneos iphonesimulator
    TARGETED_DEVICE_FAMILY: '1'
    SUPPORTS_MACCATALYST: NO
    ALWAYS_SEARCH_USER_PATHS: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    DEVELOPMENT_TEAM: 44N5RLVL28
  configs:
    Release:
      SWIFT_OPTIMIZATION_LEVEL: '-O'
      SWIFT_COMPILATION_MODE: wholemodule
      ENABLE_NS_ASSERTIONS: NO

targets:
  FixSnap:
    type: application
    platform: iOS
    deploymentTarget: '17.0'
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.superapp.fixsnapn7xv3
    sources:
      - path: FixSnap
    info:
      path: FixSnap/Info.plist
      properties:
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        CFBundleDisplayName: $(PRODUCT_NAME)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: 6.0
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconName: AppIcon
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: FixSnap uses the camera to photograph the fault you want diagnosed.
        NSPhotoLibraryUsageDescription: FixSnap needs access to your photos so you can
          choose an existing picture of the fault.
        NSLocationWhenInUseUsageDescription: FixSnap uses your location to confirm
          you're in a supported region and route you to nearby technicians.
        BOLT_DATABASE_URL: https://wlsdinfxbesdrkqxxwbz.supabase.co
        BOLT_DATABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indsc2RpbmZ4YmVzZHJrcXh4d2J6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM4Mjg5NzcsImV4cCI6MjA5OTQwNDk3N30.2SH81JdljDA4lxoGFhWtrMoQJ7LYaLF64qCYYVCPX4s
        BOLT_STORAGE_BUCKET: fault-photos
        LSRequiresIPhoneOS: true
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [ arm64 ]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

schemes:
  FixSnap:
    build:
      targets:
        FixSnap: all
    run:
      config: Debug
    archive:
      config: Release
